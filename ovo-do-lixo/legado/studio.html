<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#87c8ff}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { BUILDERS, rbox, mat } from './characters.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// sky gradient
const sky = document.createElement('canvas'); sky.width = 2; sky.height = 256;
{ const g = sky.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#3d9bff'); gr.addColorStop(0.6, '#9fd4ff'); gr.addColorStop(1, '#dff1ff'); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); }
const skyTex = new THREE.CanvasTexture(sky); skyTex.colorSpace = THREE.SRGBColorSpace; scene.background = skyTex;
scene.fog = new THREE.Fog(0xcfe9ff, 30, 80);

scene.add(new THREE.HemisphereLight(0xdff0ff, 0x6a5a3a, 1.3));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.8); fill.position.set(-6, 5, 6); scene.add(fill);

// arena: grass + dirt circle + fence
const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), mat(0x5cc24a)); grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);
const dirt = new THREE.Mesh(new THREE.CircleGeometry(9, 64), mat(0x9a6440, { roughness: 1 })); dirt.rotation.x = -Math.PI / 2; dirt.position.y = 0.01; dirt.receiveShadow = true; scene.add(dirt);
for (let i = 0; i < 48; i++) {
  const a = i / 48 * Math.PI * 2, r = 9.2;
  const post = rbox(0.25, 1.3, 0.25, 0x6b4428, 0.04); post.position.set(Math.cos(a) * r, 0.65, Math.sin(a) * r); scene.add(post);
  const a2 = (i + 0.5) / 48 * Math.PI * 2, len = 2 * Math.PI * r / 48;
  for (const y of [0.45, 0.95]) { const rail = rbox(len, 0.14, 0.1, 0x7d5232, 0.03); rail.position.set(Math.cos(a2) * r, y, Math.sin(a2) * r); rail.rotation.y = -a2 + Math.PI / 2; scene.add(rail); }
}
// pebbles & feathers
for (let i = 0; i < 40; i++) { const a = i * 2.4, r = 2 + (i * 1.37) % 6.5; const s = rbox(0.25 + (i % 3) * 0.1, 0.12, 0.2, i % 2 ? 0x8b8378 : 0x7a5a3a, 0.04); s.position.set(Math.cos(a) * r, 0.06, Math.sin(a) * r); s.rotation.y = i; scene.add(s); }
// clouds
for (let i = 0; i < 8; i++) { const c = new THREE.Group(); for (let j = 0; j < 4; j++) { const b = rbox(3 + j, 1.2, 2, 0xffffff, 0.5); b.castShadow = false; b.position.set(j * 1.6 - 2.4, (j % 2) * 0.5, 0); c.add(b); } c.position.set(-35 + i * 10, 14 + (i % 3) * 3, -45 - (i % 2) * 8); scene.add(c); }

const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 300);
const actors = {};
window.setup = (cfg) => {
  for (const k in actors) { scene.remove(actors[k]); delete actors[k]; }
  for (const a of cfg.actors) {
    const o = BUILDERS[a.kind](); o.position.set(...a.pos); o.rotation.y = a.rotY || 0;
    const ud = o.userData;
    if (ud.arms && ud.arms.length === 2 && !ud.wings) { ud.arms[0].rotation.z = -0.1; ud.arms[1].rotation.z = 0.1; }
    if (a.pose === 'proud' && ud.arms) { ud.arms[0].rotation.set(0, 0, -0.1); ud.arms[1].rotation.set(-0.2, 0, 2.6); }
    if (a.pose === 'crossed' && ud.arms) { for (const [i, s] of [[0, -1], [1, 1]]) { ud.arms[i].rotation.set(-1.35, 0, s * -0.75); } }
    scene.add(o); actors[a.id || a.kind] = o;
  }
  camera.fov = cfg.fov || 35; camera.aspect = W / H; camera.updateProjectionMatrix();
  camera.position.set(...cfg.cam); camera.lookAt(new THREE.Vector3(...cfg.target));
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script></body></html>
